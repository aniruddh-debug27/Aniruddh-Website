<!DOCTYPE html>
<html>

<head>
<title>Visitors</title>

<style>

table{
width:80%;
margin:auto;
border-collapse:collapse;
}

td,th{
border:1px solid black;
padding:10px;
}

</style>

</head>


<body>

<h1 style="text-align:center;">
Visitor Details
</h1>


<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Message</th>
</tr>


{% for v in visitors %}

<tr>

<td>{{v[0]}}</td>
<td>{{v[1]}}</td>
<td>{{v[2]}}</td>
<td>{{v[3]}}</td>

</tr>

{% endfor %}


</table>


</body>
</html>
