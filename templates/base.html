<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My Website{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_css %}{% endblock %}

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YY3QG6B4NT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-YY3QG6B4NT');
    </script>

</head>
<!-- Visitor Popup -->
<div id="visitorPopup" class="popup">
    <div class="popup-box">

        <span class="close" onclick="closePopup()">&times;</span>

        <h2>Welcome 👋</h2>
        <p>Please share your details</p>

        <form action="/visitor-info" method="POST">

            <input type="text" name="name" placeholder="Your Name" required>

            <input type="email" name="email" placeholder="Your Email" required>

            <textarea name="message" placeholder="What are you looking for?"></textarea>

            <button type="submit">Submit</button>

        </form>

    </div>
</div>


<script>
function closePopup(){
    document.getElementById("visitorPopup").style.display="none";
}

window.onload=function(){
    document.getElementById("visitorPopup").style.display="flex";
}
</script>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/hero">Hero</a>
    <a href="/about">About</a>
    <a href="/projects">Projects</a>
    <a href="/contact">Contact</a>
</nav>

{% block content %}
{% endblock %}

{% block extra_js %}
{% endblock %}

</body>
</html>
